<style>
/* ============================================================
   AURA 選物 — Design System
   單一來源的樣式檔。改品牌顏色 / 字體只要動下面的 tokens。
   ============================================================ */

/* ---------- 1. Design tokens ---------- */
:root {
  /* 品牌色：暖米白 + 陶土橘。想換品牌色改這三行就好 */
  --brand:        #B4614A;
  --brand-deep:   #8E4735;
  --brand-soft:   #F3E4DC;

  --paper:        #FBF7F2;
  --surface:      #FFFFFF;
  --surface-2:    #F5EFE7;
  --ink:          #241F1B;
  --ink-2:        #6B6158;
  --ink-3:        #9A8E82;
  --line:         #E7DED3;
  --line-strong:  #D6C8B8;
  --sale:         #A8442F;
  --ok:           #3F6B4E;

  --shadow-sm: 0 1px 2px rgba(36, 31, 27, .06);
  --shadow-md: 0 6px 24px -8px rgba(36, 31, 27, .18);
  --shadow-lg: 0 24px 60px -24px rgba(36, 31, 27, .30);

  --r-sm: 6px;
  --r-md: 12px;
  --r-lg: 20px;
  --r-full: 999px;

  --serif: "Noto Serif TC", "Songti TC", "Georgia", serif;
  --sans: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI",
          "PingFang TC", "Microsoft JhengHei", sans-serif;

  --maxw: 1180px;
  --gut: clamp(16px, 4vw, 32px);
  --header-h: 64px;

  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --brand:       #E08A6C;
    --brand-deep:  #F0A98D;
    --brand-soft:  #33251F;
    --paper:       #16130F;
    --surface:     #1F1B16;
    --surface-2:   #262119;
    --ink:         #F2ECE4;
    --ink-2:       #B8ABA0;
    --ink-3:       #8A7E74;
    --line:        #342C24;
    --line-strong: #4A3F35;
    --sale:        #E88A72;
    --ok:          #7FB08F;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 6px 24px -8px rgba(0,0,0,.6);
    --shadow-lg: 0 24px 60px -24px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --brand:       #E08A6C;
  --brand-deep:  #F0A98D;
  --brand-soft:  #33251F;
  --paper:       #16130F;
  --surface:     #1F1B16;
  --surface-2:   #262119;
  --ink:         #F2ECE4;
  --ink-2:       #B8ABA0;
  --ink-3:       #8A7E74;
  --line:        #342C24;
  --line-strong: #4A3F35;
  --sale:        #E88A72;
  --ok:          #7FB08F;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow-md: 0 6px 24px -8px rgba(0,0,0,.6);
  --shadow-lg: 0 24px 60px -24px rgba(0,0,0,.7);
  color-scheme: dark;
}

/* ---------- 2. Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.75;
  letter-spacing: .01em;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
h1,h2,h3,h4 { font-family: var(--serif); font-weight: 600; line-height: 1.35; margin: 0; letter-spacing: .02em; }
p { margin: 0 0 1em; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 4px; }

.wrap { width: 100%; max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gut); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.hide { display: none !important; }

/* ---------- 3. Typography helpers ---------- */
.eyebrow {
  font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
  color: var(--brand); font-weight: 700; margin-bottom: 10px;
}
.display { font-size: clamp(30px, 5.4vw, 52px); letter-spacing: .03em; }
.h2 { font-size: clamp(22px, 3.2vw, 32px); }
.h3 { font-size: clamp(17px, 2.2vw, 21px); }
.lede { color: var(--ink-2); font-size: clamp(14px, 1.6vw, 16px); }
.muted { color: var(--ink-2); }
.tiny { font-size: 12px; color: var(--ink-3); }

/* ---------- 4. Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; border-radius: var(--r-full); border: 1px solid transparent;
  font-size: 14px; font-weight: 600; letter-spacing: .06em;
  transition: transform .15s ease, background .2s ease, border-color .2s ease, opacity .2s;
  text-align: center; white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--brand); color: #fff; }
.btn--primary:hover { background: var(--brand-deep); }
:root[data-theme="dark"] .btn--primary,
:root:not([data-theme="light"]) .btn--primary { color: #1A120E; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .btn--primary { color:#fff; } }
.btn--ghost { border-color: var(--line-strong); color: var(--ink); background: transparent; }
.btn--ghost:hover { border-color: var(--brand); color: var(--brand); }
.btn--block { display: flex; width: 100%; }
.btn--lg { padding: 16px 32px; font-size: 15px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* ---------- 5. Header ---------- */
.announce {
  background: var(--ink); color: var(--paper);
  font-size: 12px; letter-spacing: .1em; text-align: center; padding: 9px 16px;
}
.hdr {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  border-bottom: 1px solid var(--line);
}
.hdr__in {
  height: var(--header-h); display: flex; align-items: center; gap: 20px;
}
.logo { font-family: var(--serif); font-size: 20px; letter-spacing: .18em; font-weight: 600; }
.logo span { color: var(--brand); }
.nav { display: flex; gap: 26px; margin-inline: auto; font-size: 14px; }
.nav a { color: var(--ink-2); padding: 4px 0; border-bottom: 1px solid transparent; }
.nav a:hover, .nav a.is-active { color: var(--ink); border-color: var(--brand); }
.hdr__actions { display: flex; align-items: center; gap: 6px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center;
  border: none; background: transparent; border-radius: var(--r-full); position: relative;
}
.icon-btn:hover { background: var(--surface-2); }
.cart-dot {
  position: absolute; top: 4px; right: 3px; min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--brand); color: #fff; border-radius: var(--r-full);
  font-size: 10px; font-weight: 700; display: grid; place-items: center; line-height: 1;
}
.burger { display: none; }
@media (max-width: 820px) {
  .nav {
    /* 絕對定位在 sticky 的 .hdr 之下，不依賴 backdrop-filter 的 containing block */
    position: absolute; top: 100%; left: 0; right: 0; flex-direction: column; gap: 0;
    background: var(--paper); border-bottom: 1px solid var(--line);
    padding: 8px var(--gut) 20px; margin: 0;
    transform: translateY(-110%); visibility: hidden;
    transition: transform .28s cubic-bezier(.4,0,.2,1), visibility .28s;
    box-shadow: var(--shadow-md); max-height: calc(100dvh - var(--header-h)); overflow-y: auto;
  }
  .nav.is-open { transform: none; visibility: visible; }
  .nav a { padding: 13px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
  .burger { display: grid; }
  .logo { margin-inline: auto; }
}

/* ---------- 6. Hero ---------- */
.hero {
  display: grid; grid-template-columns: 1.05fr .95fr; align-items: center;
  gap: clamp(24px, 5vw, 64px); padding: clamp(36px, 6vw, 76px) 0;
}
.hero__art {
  position: relative; border-radius: var(--r-lg); overflow: hidden;
  box-shadow: var(--shadow-lg); aspect-ratio: 4 / 5; background: var(--surface-2);
}
.hero__badge {
  position: absolute; left: 18px; top: 18px; background: var(--surface); color: var(--ink);
  border-radius: var(--r-full); padding: 7px 15px; font-size: 12px; font-weight: 700;
  letter-spacing: .08em; box-shadow: var(--shadow-sm);
}
.hero__cta { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 26px; }
.hero__meta { display: flex; gap: 26px; margin-top: 34px; flex-wrap: wrap; }
.hero__meta div { font-size: 12px; color: var(--ink-2); }
.hero__meta b { display: block; font-family: var(--serif); font-size: 19px; color: var(--ink); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr; } .hero__art { order: -1; aspect-ratio: 1/1; } }

/* ---------- 7. Sections ---------- */
.sec { padding: clamp(40px, 6vw, 76px) 0; }
.sec--alt { background: var(--surface-2); }
.sec__head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
.sec__head p { margin: 6px 0 0; max-width: 52ch; }

/* ---------- 8. Product grid / card ---------- */
.grid { display: grid; gap: clamp(16px, 2.4vw, 26px); grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md);
  overflow: hidden; display: flex; flex-direction: column;
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.card__media { position: relative; aspect-ratio: 1/1; background: var(--surface-2); overflow: hidden; }
.card__media img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.card:hover .card__media img { transform: scale(1.045); }
.card__body { padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.card__cat { font-size: 11px; letter-spacing: .16em; color: var(--ink-3); text-transform: uppercase; }
.card__name { font-family: var(--serif); font-size: 15px; line-height: 1.5; }
.card__price { margin-top: auto; padding-top: 8px; display: flex; align-items: baseline; gap: 8px; }
.price { font-weight: 700; font-size: 16px; letter-spacing: .02em; }
.price--sale { color: var(--sale); }
.price--was { font-size: 12px; color: var(--ink-3); text-decoration: line-through; font-weight: 400; }
.tag {
  position: absolute; left: 10px; top: 10px; z-index: 2;
  background: var(--brand); color: #fff; font-size: 11px; font-weight: 700;
  letter-spacing: .08em; padding: 4px 10px; border-radius: var(--r-full);
}
.tag--soon { background: var(--ink-2); }
.tag--sale { background: var(--sale); }

/* ---------- 9. Product detail ---------- */
.pdp { display: grid; grid-template-columns: 1.05fr 1fr; gap: clamp(24px, 4.5vw, 56px); padding: 28px 0 clamp(40px,6vw,72px); }
.gallery__main { border-radius: var(--r-lg); overflow: hidden; background: var(--surface-2); aspect-ratio: 1/1; box-shadow: var(--shadow-md); }
.gallery__main img { width: 100%; height: 100%; object-fit: cover; }
.gallery__thumbs { display: flex; gap: 10px; margin-top: 12px; }
.gallery__thumbs button {
  width: 68px; aspect-ratio: 1/1; border-radius: var(--r-sm); overflow: hidden; padding: 0;
  border: 2px solid transparent; background: var(--surface-2); transition: border-color .2s;
}
.gallery__thumbs button.is-active { border-color: var(--brand); }
.gallery__thumbs img { width: 100%; height: 100%; object-fit: cover; }

.pdp__price { display: flex; align-items: baseline; gap: 12px; margin: 14px 0 4px; }
.pdp__price .price { font-size: 30px; font-family: var(--serif); }
.pdp__bullets { list-style: none; padding: 0; margin: 18px 0; display: grid; gap: 9px; }
.pdp__bullets li { position: relative; padding-left: 22px; color: var(--ink-2); font-size: 14px; }
.pdp__bullets li::before {
  content: ""; position: absolute; left: 4px; top: 10px; width: 6px; height: 6px;
  border-radius: 50%; background: var(--brand);
}
.buybox { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-md); padding: 18px; margin-top: 22px; }
.opt { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.opt button {
  border: 1px solid var(--line-strong); background: transparent; border-radius: var(--r-sm);
  padding: 9px 14px; font-size: 13px; transition: all .18s; text-align: left; line-height: 1.4;
}
.opt button.is-active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-deep); font-weight: 600; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--line-strong); border-radius: var(--r-full); overflow: hidden; }
.qty button { width: 40px; height: 42px; border: none; background: transparent; font-size: 17px; }
.qty button:hover { background: var(--surface-2); }
.qty input { width: 44px; height: 42px; border: none; background: transparent; text-align: center; font-size: 15px; font-weight: 600; color: var(--ink); }
.qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.buybox__row { display: flex; gap: 12px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.trust { display: grid; gap: 8px; margin-top: 16px; font-size: 13px; color: var(--ink-2); }
.trust div { display: flex; gap: 9px; align-items: flex-start; }
.trust svg { flex: none; margin-top: 3px; color: var(--brand); }
@media (max-width: 880px) { .pdp { grid-template-columns: 1fr; } }

/* ---------- 10. Tabs / accordion ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button {
  border: none; background: transparent; padding: 13px 18px; font-size: 14px; font-weight: 600;
  color: var(--ink-2); border-bottom: 2px solid transparent; white-space: nowrap;
}
.tabs button.is-active { color: var(--ink); border-color: var(--brand); }
.tabpanel { padding: 24px 0; max-width: 74ch; }
.tabpanel h4 { font-size: 15px; margin: 22px 0 8px; }
.tabpanel h4:first-child { margin-top: 0; }
.spec { width: 100%; border-collapse: collapse; font-size: 14px; }
.spec th, .spec td { text-align: left; padding: 11px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.spec th { width: 108px; color: var(--ink-2); font-weight: 500; }

.acc { border-top: 1px solid var(--line); }
.acc__item { border-bottom: 1px solid var(--line); }
.acc__q {
  width: 100%; text-align: left; background: none; border: none; padding: 17px 34px 17px 0;
  font-size: 14px; font-weight: 600; position: relative; line-height: 1.6;
}
.acc__q::after {
  content: "+"; position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  font-size: 19px; color: var(--brand); font-weight: 400;
}
.acc__item.is-open .acc__q::after { content: "\2212"; }
.acc__a { display: none; padding: 0 34px 20px 0; color: var(--ink-2); font-size: 14px; }
.acc__item.is-open .acc__a { display: block; }

/* ---------- 11. Reviews ---------- */
.reviews { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.review { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 18px; }
.stars { color: var(--brand); letter-spacing: 3px; font-size: 13px; }
.review p { font-size: 14px; margin: 9px 0; }
.review footer { font-size: 12px; color: var(--ink-3); }

/* ---------- 12. Cart & checkout ---------- */
.cart-layout { display: grid; grid-template-columns: 1.6fr .9fr; gap: clamp(20px, 3.5vw, 40px); align-items: start; padding: 24px 0 60px; }
@media (max-width: 880px) { .cart-layout { grid-template-columns: 1fr; } }
.line {
  display: grid; grid-template-columns: 88px 1fr auto; gap: 16px; align-items: center;
  padding: 18px 0; border-bottom: 1px solid var(--line);
}
.line__img { width: 88px; aspect-ratio: 1/1; border-radius: var(--r-sm); overflow: hidden; background: var(--surface-2); }
.line__img img { width: 100%; height: 100%; object-fit: cover; }
.line__name { font-family: var(--serif); font-size: 15px; }
.line__opt { font-size: 12px; color: var(--ink-3); }
.line__rm { background: none; border: none; color: var(--ink-3); font-size: 12px; padding: 4px 0; text-decoration: underline; }
.line__rm:hover { color: var(--sale); }
@media (max-width: 560px) { .line { grid-template-columns: 68px 1fr; } .line__img { width: 68px; } .line > :last-child { grid-column: 2; } }

.summary { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 20px; position: sticky; top: calc(var(--header-h) + 16px); }
.summary__row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; color: var(--ink-2); }
.summary__row--total { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 14px; font-size: 18px; color: var(--ink); font-weight: 700; font-family: var(--serif); }
.freebar { background: var(--brand-soft); color: var(--brand-deep); border-radius: var(--r-sm); padding: 10px 12px; font-size: 12.5px; margin-bottom: 14px; line-height: 1.6; }
.freebar__track { height: 4px; background: color-mix(in srgb, var(--brand) 25%, transparent); border-radius: 99px; margin-top: 8px; overflow: hidden; }
.freebar__fill { height: 100%; background: var(--brand); border-radius: 99px; transition: width .4s ease; }

.field { margin-bottom: 15px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; letter-spacing: .04em; }
.field label span { color: var(--sale); }
.field input, .field select, .field textarea {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 14px;
}
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field .err { color: var(--sale); font-size: 12px; margin-top: 5px; display: none; }
.field.is-err input, .field.is-err select { border-color: var(--sale); }
.field.is-err .err { display: block; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }
.radio-cards { display: grid; gap: 10px; }
.radio-card {
  display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line-strong);
  border-radius: var(--r-sm); padding: 13px 15px; cursor: pointer; transition: all .18s;
}
.radio-card:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.radio-card input { margin-top: 4px; accent-color: var(--brand); flex: none; }
.radio-card b { display: block; font-size: 14px; font-weight: 600; }
.radio-card small { color: var(--ink-2); font-size: 12.5px; }
.fs { border: none; padding: 0; margin: 0 0 26px; }
.fs > legend { font-family: var(--serif); font-size: 17px; padding: 0; margin-bottom: 14px; }

.empty { text-align: center; padding: 70px 20px; }
.empty svg { color: var(--ink-3); margin-bottom: 16px; }

.done { max-width: 560px; margin: 0 auto; text-align: center; padding: 60px 0 80px; }
.done__no { font-family: var(--serif); font-size: 24px; letter-spacing: .1em; background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-md); padding: 16px; margin: 22px 0; }

/* ---------- 13. Toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 140%);
  background: var(--ink); color: var(--paper); padding: 13px 22px; border-radius: var(--r-full);
  font-size: 13.5px; z-index: 200; box-shadow: var(--shadow-lg);
  transition: transform .35s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100vw - 32px);
}
.toast.is-on { transform: translate(-50%, 0); }

/* ---------- 14. Misc blocks ---------- */
.values { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: clamp(18px,3vw,34px); }
.value svg { color: var(--brand); margin-bottom: 10px; }
.value h3 { font-size: 16px; margin-bottom: 6px; }
.value p { font-size: 13.5px; color: var(--ink-2); margin: 0; }

.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px,5vw,60px); align-items: center; }
@media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
.split__art { border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 5/4; box-shadow: var(--shadow-md); background: var(--surface-2); }

.crumb { font-size: 12px; color: var(--ink-3); padding: 18px 0 0; }
.crumb a:hover { color: var(--brand); }

.prose { max-width: 70ch; }
.prose h3 { margin: 30px 0 10px; font-size: 18px; }
.prose ul { padding-left: 20px; color: var(--ink-2); }
.prose li { margin-bottom: 7px; }

/* ---------- 15. Footer ---------- */
.ftr { background: var(--ink); color: var(--paper); padding: clamp(36px,5vw,60px) 0 26px; margin-top: 40px; }
.ftr a { color: color-mix(in srgb, var(--paper) 72%, transparent); font-size: 13.5px; }
.ftr a:hover { color: var(--paper); }
.ftr__grid { display: grid; grid-template-columns: 1.6fr 1fr 1fr 1fr; gap: clamp(20px,3vw,40px); }
@media (max-width: 780px) { .ftr__grid { grid-template-columns: 1fr 1fr; } }
.ftr h4 { font-size: 12px; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 14px; color: color-mix(in srgb, var(--paper) 60%, transparent); font-family: var(--sans); font-weight: 700; }
.ftr ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 9px; }
.ftr__brand p { color: color-mix(in srgb, var(--paper) 65%, transparent); font-size: 13.5px; max-width: 34ch; }
.ftr__bottom {
  border-top: 1px solid color-mix(in srgb, var(--paper) 16%, transparent);
  margin-top: 34px; padding-top: 18px; display: flex; justify-content: space-between;
  gap: 14px; flex-wrap: wrap; font-size: 12px; color: color-mix(in srgb, var(--paper) 55%, transparent);
}

/* ---------- 16. Motion ---------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
}

/* ============================================================
   購物車狀態：存在瀏覽器 localStorage，重新整理不會消失
   注意：這是「前端 demo」用的。真的要收錢時，價格與庫存
   必須由後端重算，不能相信瀏覽器送上來的數字。
   ============================================================ */

const CART_KEY = 'aura_cart_v1';

const Cart = {
  read() {
    try { return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch { return []; }
  },
  write(items) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(items)); } catch {}
    document.dispatchEvent(new CustomEvent('cart:change'));
  },
  key(productId, variantId) { return productId + '::' + (variantId || '-'); },

  add(productId, variantId, qty = 1) {
    const items = this.read();
    const k = this.key(productId, variantId);
    const hit = items.find(i => i.key === k);
    if (hit) hit.qty = Math.min(99, hit.qty + qty);
    else items.push({ key: k, productId, variantId, qty });
    this.write(items);
  },
  setQty(key, qty) {
    const items = this.read();
    const hit = items.find(i => i.key === key);
    if (!hit) return;
    if (qty <= 0) return this.remove(key);
    hit.qty = Math.min(99, qty);
    this.write(items);
  },
  remove(key) { this.write(this.read().filter(i => i.key !== key)); },
  clear() { this.write([]); },
  count() { return this.read().reduce((n, i) => n + i.qty, 0); },

  /** 把購物車展開成含商品資料與金額的完整列表 */
  detailed() {
    return this.read().map(i => {
      const p = PRODUCTS.find(x => x.id === i.productId);
      if (!p) return null;
      const v = p.variants ? p.variants.find(x => x.id === i.variantId) : null;
      const unit = v ? v.price : p.price;
      return { ...i, product: p, variant: v, unit, sub: unit * i.qty };
    }).filter(Boolean);
  },

  totals(shippingId) {
    const lines = this.detailed();
    const subtotal = lines.reduce((n, l) => n + l.sub, 0);
    const method = SHOP.shipping.methods.find(m => m.id === shippingId);
    let ship = 0;
    if (subtotal > 0 && method) ship = subtotal >= SHOP.shipping.freeThreshold ? 0 : method.fee;
    return { lines, subtotal, ship, method, total: subtotal + ship,
             toFree: Math.max(0, SHOP.shipping.freeThreshold - subtotal) };
  },
};

/* --- 小工具 ---------------------------------------------- */
const fmt = n => 'NT$' + Number(n).toLocaleString('zh-TW');
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const IMG = f => (typeof __IMG__ !== 'undefined' && __IMG__[f]) || ('assets/img/' + f);

function toast(msg) {
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  requestAnimationFrame(() => el.classList.add('is-on'));
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('is-on'), 2400);
}

  /* ---------------- 全部商品 ---------------- */
  products(cat) {
    const cats = ['全部', ...new Set(PRODUCTS.map(p => p.cat))];

    const list = active === '全部' ? PRODUCTS : PRODUCTS.filter(p => p.cat === active);
    return `
    <div class="wrap">
      <p class="crumb"><a href="#/">首頁</a> / 全部商品</p>
      <section class="sec" style="padding-top:22px">
        <div class="sec__head">
          <div><p class="eyebrow">ALL PRODUCTS</p><h2 class="h2">全部商品</h2>

        </div>
        <div class="opt" style="margin-bottom:24px">
          ${cats.map(c => `<button data-cat="${esc(c)}" class="${c === active ? 'is-active' : ''}">${esc(c)}</button>`).join('')}
        </div>
        <div class="grid">${list.map(card).join('')}</div>
      </section>
    </div>`;
  },

  /* ---------------- 商品詳情 ---------------- */
  product(id) {
    const p = PRODUCTS.find(x => x.id === id);
    if (!p) return View.notFound();
    const buyable = p.status === 'onsale';
    const vs = p.variants || [];
    const startPrice = vs.length ? vs[0].price : p.price;
    const avg = p.reviews.length
      ? (p.reviews.reduce((n, r) => n + r.stars, 0) / p.reviews.length).toFixed(1) : null;

    return `
    <div class="wrap">
      <p class="crumb"><a href="#/">首頁</a> / <a href="#/products">全部商品</a> / ${esc(p.name)}</p>

      <section class="pdp">
        <div>
          <div class="gallery__main"><img id="galMain" src="${IMG(p.images[0])}" alt="${esc(p.name)}" width="800" height="800"></div>
          ${p.images.length > 1 ? `<div class="gallery__thumbs">
            ${p.images.map((f, i) => `<button data-img="${IMG(f)}" class="${i === 0 ? 'is-active' : ''}" aria-label="圖片 ${i + 1}"><img src="${IMG(f)}" alt="" width="200" height="200"></button>`).join('')}
          </div>` : ''}
        </div>

        <div>
          <p class="eyebrow">${esc(p.cat)}${avg ? ` · ★ ${avg}（${p.reviews.length} 則評價）` : ''}</p>

          <p class="tiny" style="letter-spacing:.14em;margin-top:4px">${esc(p.en)}</p>
          <div class="pdp__price">
            <span class="price ${p.compareAt ? 'price--sale' : ''}" id="pdpPrice">${fmt(startPrice)}</span>
            ${p.compareAt ? `<span class="price--was">${fmt(p.compareAt)}</span>` : ''}
            <span class="tiny">含稅</span>
          </div>
          <p class="lede" style="margin-top:12px">${esc(p.short)}</p>
          <ul class="pdp__bullets">${p.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>

          <div class="buybox" data-pid="${p.id}">
            ${vs.length ? `
              <label class="tiny" style="display:block;margin-bottom:8px;font-weight:700;letter-spacing:.08em">選擇組合</label>
              <div class="opt" id="variantOpts">
                ${vs.map((v, i) => `<button data-vid="${v.id}" data-price="${v.price}" class="${i === 0 ? 'is-active' : ''}">
                  ${esc(v.label)}<br><span class="tiny">${esc(v.note)}</span></button>`).join('')}
              </div>` : ''}
            <div class="buybox__row">
              <div class="qty">
                <button data-q="-1" aria-label="減少數量">−</button>
                <input id="qty" type="number" value="1" min="1" max="99" aria-label="數量">
                <button data-q="1" aria-label="增加數量">+</button>
              </div>
              <button class="btn btn--primary" id="addCart" style="flex:1" ${buyable ? '' : 'disabled'}>
                ${buyable ? '加入購物車' : p.status === 'preorder' ? '預購中，敬請期待' : '售完補貨中'}
              </button>
            </div>
            ${buyable ? `<button class="btn btn--ghost btn--block" id="buyNow">直接結帳</button>` : ''}
            <div class="trust">
              <div>${Icon.check}<span>單筆滿 ${fmt(SHOP.shipping.freeThreshold)} 免運費</span></div>
              <div>${Icon.check}<span>週一至週五 12:00 前付款完成，當日出貨</span></div>
              <div>${Icon.check}<span>台灣製造，可提供檢驗報告</span></div>
            </div>
          </div>
        </div>
      </section>

      <section style="padding-bottom:60px">
        <div class="tabs" id="pdpTabs">
          <button data-tab="story" class="is-active">商品介紹</button>
          <button data-tab="how">使用方式</button>
          <button data-tab="spec">規格</button>
          <button data-tab="ing">全成分</button>
          ${p.faq.length ? '<button data-tab="faq">常見問題</button>' : ''}
          ${p.reviews.length ? '<button data-tab="rev">顧客評價</button>' : ''}
        </div>

        <div class="tabpanel" data-panel="story">
          <p style="white-space:pre-line">${esc(p.story)}</p>
          <h4>使用注意事項</h4>
          <ul class="prose" style="padding-left:20px;color:var(--ink-2)">${p.notes.map(n => `<li>${esc(n)}</li>`).join('')}</ul>
        </div>
        <div class="tabpanel hide" data-panel="how">
          <ol style="padding-left:20px;color:var(--ink-2)">${p.how.map(h => `<li style="margin-bottom:8px">${esc(h)}</li>`).join('')}</ol>
        </div>
        <div class="tabpanel hide" data-panel="spec">
          <table class="spec"><tbody>
            ${Object.entries(p.spec).map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('')}
          </tbody></table>
        </div>
        <div class="tabpanel hide" data-panel="ing">
          <p style="white-space:pre-line;color:var(--ink-2)">${esc(p.ingredients)}</p>
        </div>
        ${p.faq.length ? `<div class="tabpanel hide" data-panel="faq">
          <div class="acc">${p.faq.map(f => `
            <div class="acc__item"><button class="acc__q">${esc(f.q)}</button><div class="acc__a">${esc(f.a)}</div></div>`).join('')}
          </div>
        </div>` : ''}
        ${p.reviews.length ? `<div class="tabpanel hide" data-panel="rev">
          <div class="reviews">${p.reviews.map(r => `
            <div class="review">
              <div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5 - r.stars)}</div>
              <p>${esc(r.text)}</p>
              <footer>${esc(r.name)} · ${esc(r.date)}</footer>
            </div>`).join('')}
          </div>
          <p class="tiny" style="margin-top:14px">評價為實際購買者於出貨後留下，未經修改。</p>
        </div>` : ''}
      </section>

      <section class="sec" style="border-top:1px solid var(--line)">
        <div class="sec__head"><h2 class="h2">也許你也會喜歡</h2></div>
        <div class="grid">${PRODUCTS.filter(x => x.id !== p.id).slice(0, 4).map(card).join('')}</div>
      </section>
    </div>`;
  },

      <div class="cart-layout">

          <p class="tiny" style="margin-bottom:10px">共 ${Cart.count()} 件商品</p>
          ${t.lines.map(l => `
            <div class="line" data-key="${esc(l.key)}">
              <a class="line__img" href="#/product/${l.product.id}"><img src="${IMG(l.product.images[0])}" alt="${esc(l.product.name)}"></a>
              <div>
                <a class="line__name" href="#/product/${l.product.id}">${esc(l.product.name)}</a>
                ${l.variant ? `<div class="line__opt">${esc(l.variant.label)}</div>` : ''}

                <div class="qty" style="margin-top:8px">
                  <button data-cq="-1" aria-label="減少">−</button>
                  <input type="number" value="${l.qty}" min="1" max="99" data-cqty aria-label="數量">
                  <button data-cq="1" aria-label="增加">+</button>
                </div>
              </div>
              <div style="text-align:right">
                <div class="price">${fmt(l.sub)}</div>
                <button class="line__rm" data-rm>移除</button>
              </div>
            </div>`).join('')}

        <aside class="summary">
          <h3 class="h3" style="margin-bottom:12px">訂單摘要</h3>
          ${View._freebar(t)}
          <div class="summary__row"><span>商品小計</span><span>${fmt(t.subtotal)}</span></div>
          <div class="summary__row"><span>運費</span><span>結帳時計算</span></div>
          <div class="summary__row summary__row--total"><span>小計</span><span>${fmt(t.subtotal)}</span></div>
          <a class="btn btn--primary btn--block btn--lg" href="#/checkout" style="margin-top:16px">前往結帳</a>
          <a class="btn btn--ghost btn--block" href="#/products" style="margin-top:10px">繼續選購</a>
        </aside>
      </div>
    </div>`;
  },

  _freebar(t) {
    if (t.subtotal <= 0) return '';
    if (t.toFree <= 0) return `<div class="freebar">已達免運門檻，這筆訂單免運費 🎉</div>`;
    const pct = Math.min(100, (t.subtotal / SHOP.shipping.freeThreshold) * 100);
    return `<div class="freebar">再買 <b>${fmt(t.toFree)}</b> 就免運費
      <div class="freebar__track"><div class="freebar__fill" style="width:${pct}%"></div></div></div>`;
  },

      <p class="crumb"><a href="#/">首頁</a> / <a href="#/cart">購物車</a> / 結帳</p>

            <legend>付款方式</legend>
            <div class="radio-cards" id="payOpts">
              ${SHOP.payments.map((p, i) => `
                <label class="radio-card">
                  <input type="radio" name="pay" value="${p.id}" ${i === 0 ? 'checked' : ''}>

  /* ---------------- 購物須知 ---------------- */

          <h3>隱私權政策（摘要）</h3>
          <ul>
            <li>我們僅蒐集完成交易所必要之個人資料：姓名、電話、Email、配送地址。</li>
            <li>資料僅用於訂單處理、物流配送與客服聯繫，不會提供給無關第三方。</li>
            <li>你可隨時來信要求查閱、更正或刪除你的個人資料。</li>
          </ul>
          <h3>營業資訊</h3>
          <ul>
            <li>${esc(SHOP.legal.company)}　統一編號：${esc(SHOP.legal.taxId)}</li>
            <li>地址：${esc(SHOP.legal.address)}</li>
            <li>客服信箱：${esc(SHOP.contact.email)}</li>
          </ul>
        </div>
      </section>
    </div>`;
  },

  notFound() {
    return `<div class="wrap"><div class="empty">
      <h2 class="h2">找不到這個頁面</h2>
      <p class="muted">連結可能已經失效，或商品已下架。</p>
      <a class="btn btn--primary" href="#/" style="margin-top:10px">回首頁</a>
    </div></div>`;
  },
};


/* ============================================================
   路由 + 互動。整站是單頁式（hash routing），
   丟到任何靜態主機都能跑，不需要伺服器端程式。
   ============================================================ */

const app = document.getElementById('app');

/* ---------- Header / Footer ---------- */
function renderChrome() {
  document.getElementById('announce').textContent = SHOP.announce;

  document.getElementById('hdr').innerHTML = `
    <div class="wrap hdr__in">
      <button class="icon-btn burger" id="burger" aria-label="開啟選單" aria-expanded="false">${Icon.menu}</button>
      <a class="logo" href="#/">${SHOP.logoZh}<span> ${SHOP.logoAccent}</span></a>
      <nav class="nav" id="nav">
        <a href="#/">首頁</a>
        <a href="#/products">全部商品</a>
        <a href="#/product/${PRODUCTS[0].id}">本月主打</a>
        <a href="#/about">關於我們</a>
        <a href="#/faq">購物須知</a>
      </nav>
      <div class="hdr__actions">
        <a class="icon-btn" href="#/cart" aria-label="購物車">${Icon.cart}<span class="cart-dot hide" id="cartDot">0</span></a>
      </div>
    </div>`;

  document.getElementById('ftr').innerHTML = `
    <div class="wrap">
      <div class="ftr__grid">
        <div class="ftr__brand">
          <div class="logo" style="margin-bottom:10px">${SHOP.logoZh}<span> ${SHOP.logoAccent}</span></div>
          <p>${esc(SHOP.intro)}</p>
        </div>
        <div><h4>選購</h4><ul>
          <li><a href="#/products">全部商品</a></li>
          <li><a href="#/product/${PRODUCTS[0].id}">本月主打</a></li>
          <li><a href="#/cart">購物車</a></li>
        </ul></div>
        <div><h4>服務</h4><ul>
          <li><a href="#/faq">購物須知</a></li>
          <li><a href="#/faq">退換貨規定</a></li>
          <li><a href="#/about">關於我們</a></li>
        </ul></div>
        <div><h4>聯絡</h4><ul>
          <li><a href="#/about">LINE ${esc(SHOP.contact.line)}</a></li>
          <li><a href="#/about">IG @${esc(SHOP.contact.ig)}</a></li>
          <li><a href="mailto:${esc(SHOP.contact.email)}">${esc(SHOP.contact.email)}</a></li>
        </ul></div>
      </div>
      <div class="ftr__bottom">
        <span>© ${new Date().getFullYear()} ${esc(SHOP.legal.company)}　統編 ${esc(SHOP.legal.taxId)}</span>
        <span>本站商品為化粧品，非醫療用品，不具療效。</span>
      </div>
    </div>`;

  document.getElementById('burger').addEventListener('click', e => {
    const nav = document.getElementById('nav');
    const open = nav.classList.toggle('is-open');
    e.currentTarget.setAttribute('aria-expanded', String(open));
  });
}

function syncCartDot() {
  const n = Cart.count();
  const dot = document.getElementById('cartDot');
  dot.textContent = n;
  dot.classList.toggle('hide', n === 0);
}

function syncNav(path) {
  document.querySelectorAll('#nav a').forEach(a => {
    const href = a.getAttribute('href').slice(1);
    a.classList.toggle('is-active', href === path || (href !== '/' && path.startsWith(href)));
  });
}

/* ---------- Router ---------- */
function route() {
  const path = (location.hash || '#/').slice(1);
  const [, seg1, seg2] = path.split('/');
  document.getElementById('nav').classList.remove('is-open');

  let html, title = SHOP.name;
  switch (seg1) {
    case '':          html = View.home();  title = `${SHOP.name}｜${SHOP.tagline}`; break;
    case 'products':  html = View.products(seg2 && decodeURIComponent(seg2)); title = `全部商品｜${SHOP.name}`; break;
    case 'product': {
      const p = PRODUCTS.find(x => x.id === seg2);
      html = View.product(seg2); title = p ? `${p.name}｜${SHOP.name}` : title; break;
    }
    case 'cart':      html = View.cart();     title = `購物車｜${SHOP.name}`; break;
    case 'checkout':  html = View.checkout(); title = `結帳｜${SHOP.name}`; break;
    case 'done':      html = View.done(decodeURIComponent(seg2 || '')); title = `訂單完成｜${SHOP.name}`; break;
    case 'about':     html = View.about();    title = `關於我們｜${SHOP.name}`; break;
    case 'faq':       html = View.faq();      title = `購物須知｜${SHOP.name}`; break;
    default:          html = View.notFound(); title = `找不到頁面｜${SHOP.name}`;
  }

  app.innerHTML = html;
  document.title = title;
  syncNav(path);
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });

  if (seg1 === 'product') bindProduct(seg2);
  if (seg1 === 'products') bindProducts();
  if (seg1 === 'cart') bindCart();
  if (seg1 === 'checkout') bindCheckout();
  bindAccordions();
}

/* ---------- 共用：手風琴 ---------- */
function bindAccordions() {
  app.querySelectorAll('.acc__q').forEach(btn => {
    btn.addEventListener('click', () => btn.parentElement.classList.toggle('is-open'));
  });
}

/* ---------- 全部商品：分類篩選 ---------- */
function bindProducts() {
  app.querySelectorAll('[data-cat]').forEach(b => {
    b.addEventListener('click', () => {
      const c = b.dataset.cat;
      location.hash = c === '全部' ? '#/products' : '#/products/' + encodeURIComponent(c);
    });
  });
}

/* ---------- 商品頁 ---------- */
function bindProduct(id) {
  const p = PRODUCTS.find(x => x.id === id);
  if (!p) return;

  // 圖片切換
  app.querySelectorAll('.gallery__thumbs button').forEach(b => {
    b.addEventListener('click', () => {
      app.querySelector('#galMain').src = b.dataset.img;
      app.querySelectorAll('.gallery__thumbs button').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
    });
  });

  // 規格選擇
  let variantId = p.variants ? p.variants[0].id : null;
  app.querySelectorAll('#variantOpts button').forEach(b => {
    b.addEventListener('click', () => {
      app.querySelectorAll('#variantOpts button').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
      variantId = b.dataset.vid;
      app.querySelector('#pdpPrice').textContent = fmt(b.dataset.price);
    });
  });

  // 數量
  const qtyEl = app.querySelector('#qty');
  app.querySelectorAll('[data-q]').forEach(b => {
    b.addEventListener('click', () => {
      const next = Math.min(99, Math.max(1, (parseInt(qtyEl.value, 10) || 1) + Number(b.dataset.q)));
      qtyEl.value = next;
    });
  });
  qtyEl?.addEventListener('change', () => {
    qtyEl.value = Math.min(99, Math.max(1, parseInt(qtyEl.value, 10) || 1));
  });

  const add = () => Cart.add(p.id, variantId, parseInt(qtyEl.value, 10) || 1);
  app.querySelector('#addCart')?.addEventListener('click', () => {
    add(); toast(`已加入購物車：${p.name}`);
  });
  app.querySelector('#buyNow')?.addEventListener('click', () => { add(); location.hash = '#/checkout'; });

  // 分頁籤
  app.querySelectorAll('#pdpTabs button').forEach(b => {
    b.addEventListener('click', () => {
      app.querySelectorAll('#pdpTabs button').forEach(x => x.classList.remove('is-active'));
      b.classList.add('is-active');
      app.querySelectorAll('[data-panel]').forEach(pl =>
        pl.classList.toggle('hide', pl.dataset.panel !== b.dataset.tab));
    });
  });
}

/* ---------- 購物車頁 ---------- */
function bindCart() {
  app.querySelectorAll('.line').forEach(line => {
    const key = line.dataset.key;
    const input = line.querySelector('[data-cqty]');
    line.querySelectorAll('[data-cq]').forEach(b => b.addEventListener('click', () => {
      Cart.setQty(key, (parseInt(input.value, 10) || 1) + Number(b.dataset.cq));
      route();
    }));
    input.addEventListener('change', () => { Cart.setQty(key, parseInt(input.value, 10) || 1); route(); });
    line.querySelector('[data-rm]').addEventListener('click', () => {
      Cart.remove(key); toast('已從購物車移除'); route();
    });
  });
}

/* ---------- 結帳頁 ---------- */
function bindCheckout() {
  const form = app.querySelector('#coForm');
  if (!form) return;

  const recalc = () => {
    const shipId = form.querySelector('input[name="ship"]:checked').value;
    const t = Cart.totals(shipId);
    app.querySelector('#coShip').textContent = t.ship === 0 ? '免運' : fmt(t.ship);
    app.querySelector('#coTotal').textContent = fmt(t.total);

    // 貨到付款只在「超商取貨付款」時可選
    const codRadio = form.querySelector('input[name="pay"][value="cod"]');
    const codLabel = codRadio.closest('.radio-card');
    const allowCod = shipId === 'cvspay';
    codRadio.disabled = !allowCod;
    codLabel.style.opacity = allowCod ? '1' : '.45';
    if (!allowCod && codRadio.checked) form.querySelector('input[name="pay"][value="card"]').checked = true;
  };
  form.querySelectorAll('input[name="ship"]').forEach(r => r.addEventListener('change', recalc));
  recalc();

  // 發票欄位連動
  const inv = form.querySelector('#f-inv');
  inv.addEventListener('change', () => {
    const extra = app.querySelector('#invExtra');
    const label = app.querySelector('#invLabel');
    const input = app.querySelector('#f-invno');
    if (inv.value === 'member') { extra.classList.add('hide'); return; }
    extra.classList.remove('hide');
    if (inv.value === 'mobile') { label.textContent = '手機條碼'; input.placeholder = '/ABC+123'; }
    else { label.textContent = '統一編號 / 抬頭'; input.placeholder = '12345678 範例有限公司'; }
  });

  const fail = (id, on) => app.querySelector(id).closest('.field').classList.toggle('is-err', on);

  form.addEventListener('submit', e => {
    e.preventDefault();
    const v = k => form.querySelector('#f-' + k).value.trim();
    let ok = true;
    const bad = (id, cond) => { fail(id, cond); if (cond) ok = false; };

    bad('#f-name', v('name').length < 1);
    bad('#f-phone', !/^09\d{8}$/.test(v('phone').replace(/[\s-]/g, '')));
    bad('#f-email', !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v('email')));
    bad('#f-addr', v('addr').length < 4);
    if (inv.value !== 'member') bad('#f-invno', v('invno').length < 3);

    const agree = form.querySelector('#f-agree').checked;
    app.querySelector('#agreeErr').style.display = agree ? 'none' : 'block';
    if (!agree) ok = false;

    if (!ok) {
      const first = form.querySelector('.is-err, #agreeErr[style*="block"]');
      first?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      toast('有欄位還沒填好，請往上檢查');
      return;
    }

    const no = 'AS' + new Date().toISOString().slice(2, 10).replace(/-/g, '') +
               '-' + String(Math.floor(Math.random() * 9000) + 1000);
    Cart.clear();
    location.hash = '#/done/' + no;
  });
}

/* ---------- Boot ---------- */
renderChrome();
syncCartDot();
document.addEventListener('cart:change', syncCartDot);
window.addEventListener('hashchange', route);
route();

</script>
</body>
</html>
